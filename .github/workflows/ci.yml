name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Both jobs only read the repository. Declared rather than inherited, so the token handed to the
# build, Lighthouse and the Playwright installer never carries more than that, whatever the
# repository default becomes. Artifact uploads use the runtime token, not these scopes.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RAWG_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: git diff --exit-code -- '**/__generated__/**'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # `pnpm typecheck` only covers the four projects Nuxt generates (app, server, shared, node).
      # The refresh job under `scripts/` belongs to none of them, so it gets its own project.
      - run: pnpm typecheck:scripts
      - run: pnpm test
      - run: pnpm build
        env:
          NITRO_PRESET: vercel
      # The Vercel preset compiles routeRules headers into a proxy-level route table. A
      # Content-Security-Policy there would have no per-response script hashes and would stop every
      # page hydrating, in production only — so the built output is checked, not just the source.
      - run: pnpm check:vercel-headers

  # The quality gates: the /games JavaScript budget, the Playwright smoke flows with axe, and
  # Lighthouse CI — all against one production build started in this job. Node preset and fixture
  # data, because Vercel previews sit behind a login and the gates must need no secrets. A job of
  # its own so it runs beside `verify` rather than after it; the Vercel build and its header check
  # stay there, untouched.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAWG_FIXTURES: '1'
      NUXT_RAWG_FIXTURES: '1'
      NITRO_PRESET: node-server
      # Canonical and hreflang links are built from the site URL; pointing it at the server under
      # test keeps Lighthouse's SEO audit judging the links this build actually emits.
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      QUALITY_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the production server
        id: server
        env:
          PORT: '3000'
        run: |
          nohup node .output/server/index.mjs > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 5 --output /dev/null "$QUALITY_BASE_URL/games"; then
              exit 0
            fi
            sleep 1
          done
          echo "The server did not answer /games within 60 attempts." >&2
          cat server.log >&2
          exit 1
      # Each gate runs whenever the server is up, so one failing gate does not hide the others.
      - name: Bundle budget
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: pnpm check:bundle-budget
      - name: Install Playwright's Chromium
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Playwright smoke flows
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: pnpm e2e
      # Chrome comes from the runner image; Lighthouse finds it on its own.
      - name: Lighthouse CI
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          # The reports folder holds one HTML and one JSON per run; the raw copies beside it are
          # duplicates.
          path: .lighthouseci/reports/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            server.log
          if-no-files-found: ignore
          retention-days: 14
