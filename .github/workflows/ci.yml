name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RAWG_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: git diff --exit-code -- '**/__generated__/**'
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NITRO_PRESET: vercel
      # The Vercel preset compiles routeRules headers into a proxy-level route table. A
      # Content-Security-Policy there would have no per-response script hashes and would stop every
      # page hydrating, in production only — so the built output is checked, not just the source.
      - run: pnpm check:vercel-headers
