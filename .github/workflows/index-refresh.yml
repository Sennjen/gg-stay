name: Index refresh
# The price and localisation index is rebuilt here rather than on Vercel: a full run walks
# seventy-five RAWG pages and reads Steam languages at forty requests a minute, which no
# serverless function may run for.
#
# THE SCHEDULES ARE COMMENTED OUT ON PURPOSE. `createWriterFromEnv` in scripts/index/writer.ts
# still throws until the Upstash adapter lands, so every scheduled run would fail and email the
# owner, and a permanently red "Index refresh" is an alert channel nobody reads any more. They are
# enabled in the pull request that plugs the adapter in; until then the job runs on demand.
#
# Note when enabling them: GitHub disables `schedule:` triggers on a repository with no activity
# for sixty days, and has to be told to re-enable them.
on:
  # schedule:
  #   # Prices every six hours — one batched Steam call over the published documents.
  #   - cron: '15 */6 * * *'
  #   # The whole catalog nightly at 02:30 UTC: candidates, new app ids, prices, due languages.
  #   - cron: '30 2 * * *'
  #   # The rest of the language sweep, weekly, Sunday 04:00 UTC.
  #   - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: What to refresh
        type: choice
        default: prices
        options:
          - prices
          - full
          - languages
      pages:
        description: RAWG pages of candidates — full runs only, blank means the default 75
        type: string
        required: false
      force_unlock:
        description: Take the writer lock even if a dead run still holds it
        type: boolean
        default: false

# One run at a time, and never cancelled half way: two runs would fight over the same version, and
# a cancelled run leaves a draft nobody discards and a lock nobody releases.
concurrency:
  group: index-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full run is about an hour; the ceiling is there to end a wedged run, not to pace one.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The schedule that fired decides the mode; a manual run says so itself. Both arrive through
      # the environment and neither is interpolated into a script, and the case statement is an
      # allow-list rather than a translation, so an input that ever becomes free text still cannot
      # reach the shell as anything but one of these three words.
      - id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$SCHEDULE" in
            '30 2 * * *') mode=full ;;
            '0 4 * * 0') mode=languages ;;
            '15 */6 * * *') mode=prices ;;
            '')
              case "$INPUT_MODE" in
                full|prices|languages) mode="$INPUT_MODE" ;;
                '') mode=prices ;;
                *) echo "Unknown mode input" >&2; exit 1 ;;
              esac
              ;;
            *) echo "Unknown schedule" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # The write token lives only here: the site on Vercel gets a read-only one. The job never
      # prints either, and it proves it may write before it spends any RAWG quota. Everything the
      # script needs comes through `env:`; nothing is interpolated into the command line.
      - name: Refresh the index
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          INDEX_PAGES: ${{ inputs.pages }}
          INDEX_FORCE_UNLOCK: ${{ inputs.force_unlock }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: pnpm index:refresh --mode="$MODE"
