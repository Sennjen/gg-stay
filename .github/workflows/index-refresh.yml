name: Index refresh
# The price and localisation index is rebuilt here rather than on Vercel: a full run walks
# seventy-five RAWG pages and reads Steam languages at forty requests a minute, which no
# serverless function may run for.
#
# GitHub disables `schedule:` triggers on a repository with no activity for sixty days and has to
# be told to re-enable them, so a long quiet spell is worth checking for here.
on:
  schedule:
    # Prices every six hours — one batched Steam call over the published documents. Every other
    # one also reads GOG and the Microsoft Store: whichever run finds a store's last read more
    # than eleven hours old reads it, so those are read twice a day whatever else is scheduled.
    # And each of the four reads its portion of the PlayStation Store's prices, a request every
    # ten seconds for forty minutes at the most, each price once a day, and then maps the titles
    # waiting for a concept with what is left, pricing each right after: that, and not Steam, is
    # what a prices run now spends its time on, about forty-five minutes at the most. When Sony
    # refuses a request, no run of any kind asks it anything for a day.
    - cron: '15 */6 * * *'
    # The whole catalog nightly at 02:30 UTC: candidates, Ukrainian studios' games, new app ids,
    # prices, due languages. It asks the PlayStation Store as a prices run does, prices first,
    # within two hundred requests, ten seconds apart: thirty-five minutes.
    - cron: '30 2 * * *'
    # The rest of the language sweep, weekly, Sunday 04:00 UTC. It asks the PlayStation Store
    # nothing.
    - cron: '0 4 * * 0'
  # A manual run chooses its mode. `resolve` is manual only — no schedule above selects it, and
  # none should: it spends RAWG requests on games the index does not hold yet, as many as its
  # `budget` says and no more, and publishes nothing (scripts/index/resolve.ts). Nor is `export`:
  # it only reads the index, reads RAWG's list pages inside its `budget`, and hands every game the
  # job knows, with its store links and prices, out as a CSV file in an artifact
  # (scripts/index/export.ts). A budget of 300 reads the default 221 pages and leaves room to ask
  # again for the pages RAWG fails now and then; a page it fails on every try is skipped and named
  # in the summary.
  workflow_dispatch:
    inputs:
      mode:
        description: What to refresh
        type: choice
        default: prices
        options:
          - prices
          - full
          - languages
          - resolve
          - export
      pages:
        description: >-
          RAWG pages. full: pages of candidates, blank means 75. resolve: the most pages to read
          from from_page, blank means 250. export: the most pages to read from page 1, blank
          means 221
        type: string
        required: false
      budget:
        description: >-
          resolve and export only, and required for both: the most RAWG requests the run may
          send, retries included (resolve: at most 8000; export: at most 400, and 300 reads the
          221 pages with room for the tries of the pages RAWG fails)
        type: string
        required: false
      from_page:
        description: >-
          resolve only: the first page of the most-added order to read, blank means 76 (pages 1
          to 75 are the nightly run's)
        type: string
        required: false
      force_unlock:
        description: Take the writer lock even if a dead run still holds it
        type: boolean
        default: false

# One run at a time, and never cancelled half way: two runs would fight over the same version, and
# a cancelled run leaves a draft nobody discards and a lock nobody releases.
concurrency:
  group: index-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full run is just under two hours at the most: an hour, up to twenty minutes of store
    # links while there are any to find, thirty-five to forty of PlayStation Store titles. A
    # prices run is forty-five minutes at the most. The ceiling is there to end a wedged run, not
    # to pace one.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The schedule that fired decides the mode; a manual run says so itself. Both arrive through
      # the environment and neither is interpolated into a script, and the case statement is an
      # allow-list rather than a translation, so an input that ever becomes free text still cannot
      # reach the shell as anything but one of these five words. A schedule names one of three:
      # `resolve` and `export` are in the manual arm alone.
      - id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$SCHEDULE" in
            '30 2 * * *') mode=full ;;
            '0 4 * * 0') mode=languages ;;
            '15 */6 * * *') mode=prices ;;
            '')
              case "$INPUT_MODE" in
                full|prices|languages|resolve|export) mode="$INPUT_MODE" ;;
                '') mode=prices ;;
                *) echo "Unknown mode input" >&2; exit 1 ;;
              esac
              ;;
            *) echo "Unknown schedule" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # The write token lives only here: the site on Vercel gets a read-only one. The job never
      # prints either, and it proves it may write before it spends any RAWG quota. Everything the
      # script needs comes through `env:`; nothing is interpolated into the command line.
      # A dead run's lock frees itself in half an hour (see INDEX_LOCK_TTL_SECONDS), which is well
      # inside the gap to the next scheduled run. `force_unlock` is for the operator who retries
      # sooner than that.
      # The numbers of a resolve run are free text from a form: the script reads them from the
      # environment and takes nothing but whole numbers, and refuses to start without a budget or
      # with one above its ceiling. On a schedule all three are empty. Any other mode refuses to
      # start when it is given a budget or a first page: a mode chosen by mistake spends nothing.
      - name: Refresh the index
        if: steps.mode.outputs.mode != 'export'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          INDEX_PAGES: ${{ inputs.pages }}
          INDEX_BUDGET: ${{ inputs.budget }}
          INDEX_FROM_PAGE: ${{ inputs.from_page }}
          INDEX_FORCE_UNLOCK: ${{ inputs.force_unlock }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          RAWG_API_KEY_SPARE: ${{ secrets.RAWG_API_KEY_SPARE }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: pnpm index:refresh --mode="$MODE"

      # An export reads and never writes: it takes no lock, runs no write probe and sends Redis
      # read commands only. It is given the job's token all the same, because the repository
      # holds no other; the code is what keeps it to reading (tests/server/job/export.test.ts).
      # A first page is handed on only so that the script refuses it.
      - name: Export the games
        if: steps.mode.outputs.mode == 'export'
        env:
          INDEX_PAGES: ${{ inputs.pages }}
          INDEX_BUDGET: ${{ inputs.budget }}
          INDEX_FROM_PAGE: ${{ inputs.from_page }}
          INDEX_EXPORT_DIR: games-export
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          RAWG_API_KEY_SPARE: ${{ secrets.RAWG_API_KEY_SPARE }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: pnpm index:refresh --mode=export

      # The file, for the owner to download from the run's page: kept a week.
      - name: Upload the export
        if: steps.mode.outputs.mode == 'export'
        uses: actions/upload-artifact@v7
        with:
          name: games-export-${{ github.run_number }}
          path: games-export/
          if-no-files-found: error
          retention-days: 7
