fragment LandingGameCard on GameCard {
  id
  slug
  name
  released
  rating
  metacritic
  cover {
    url
  }
  screenshots {
    url
  }
  platformFamilies
  platforms {
    id
    slug
    name
  }
  genres {
    id
    slug
    name
  }
  price {
    bestUah
    discountPercent
    isFree
  }
  localisation {
    interface
    subtitles
    audio
  }
  madeInUkraine
}

query Landing {
  landing {
    featured {
      clipUrl
      clipSource
      game {
        slug
        name
        cover {
          url
        }
        released
        platformFamilies
      }
    }
    carousel {
      ...LandingGameCard
    }
    newReleases {
      ...LandingGameCard
    }
    topRated {
      ...LandingGameCard
    }
    totalGames
  }
}
