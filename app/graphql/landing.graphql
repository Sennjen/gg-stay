# The ring only ever renders a cover and a link, so the carousel (24 cards on the ISR-cached LCP
# page) asks for four fields, not a full card payload.
fragment RingGameCard on GameCard {
  id
  slug
  name
  cover {
    url
  }
}

# The shelves (and the game page's similar games) render `GameCard`, so this fragment must match
# what `Games` selects for a card.
fragment RowGameCard on GameCard {
  id
  slug
  name
  released
  metacritic
  cover {
    url
  }
  screenshots {
    url
  }
  platformFamilies
  price {
    bestUah
    regularUah
    discountPercent
    isFree
    updatedAt
  }
  localisation {
    text
    audio
    source
  }
  madeInUkraine
}

query Landing {
  landing {
    featured {
      clipUrl
      clipSource
      game {
        slug
        name
        cover {
          url
        }
      }
    }
    carousel {
      ...RingGameCard
    }
    shelves {
      id
      games {
        ...RowGameCard
      }
    }
    totalGames
  }
}
