# Only what a card renders. `rating`, `platforms` and `genres` stay in the schema (they document
# where the week-2 index plugs in) but are not selected: nothing reads them, and the server
# hard-codes most of them to null today. Paging is derived from `total`/`pageSize`, so `hasNext`
# is not selected either. `price` and `localisation` ARE selected: the card renders a price line
# and a localisation badge, null on a game outside the index.
# `screenshots` is a list because `GameCard.screenshots` takes no argument; the mapper already
# caps it at four and only the first one is used, as the card's hover preview.
query Games($filter: GameFilter, $sort: GameSort, $page: Int, $pageSize: Int) {
  games(filter: $filter, sort: $sort, page: $page, pageSize: $pageSize) {
    total
    page
    pageSize
    items {
      id
      slug
      name
      released
      metacritic
      cover {
        url
      }
      screenshots {
        url
      }
      platformFamilies
      price {
        bestUah
        regularUah
        discountPercent
        isFree
        updatedAt
      }
      localisation {
        text
        audio
        source
      }
    }
  }
}
